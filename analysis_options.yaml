include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Annotated fixture files are inputs to the metrics engine, not code to lint.
    # Some are deliberately invalid to exercise partial-parse behavior.
    - test/fixtures/**
    - test/harness/fixtures/**
    - test/probe/fixtures/**
    - test/golden/src/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - unawaited_futures

# Built-in defaults (cyclomatic warn 10 / fail 20); the bare key makes this
# directory a config root.
dmetrics:
