name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      # Analyzer, formatting, tests, and dmetrics measuring itself against
      # dmetrics_baseline.json: a new failure or a baselined one getting
      # worse fails the job.
      - run: make check
